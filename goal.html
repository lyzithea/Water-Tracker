<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Water Goal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="home.html">Home</a>
       </nav>
    </header>


    <main>
        <h1>Choose Your Daily Goal</h1>

          <div class="daily-goal">
            
                <label for="water-amount" >Choose your daily 
                    intake of water:
                </label>
                    <br>
        
        <select id="water-amount" name="water-amount" required>
            <option value="" selected disabled></option>
            <option value="1500">1,5 L</option>
            <option value="2000">2 L</option>
            <option value="2500">2,5 L</option>
            <option value="3000">3 L</option>
            <option value="3500">3,5 L</option>
        </select>

            <button type="button" id="set-goal">Set Goal</button>
            
         </div>



                
         <div id="goalEntry">

         </div>
             


        <div class="next">
            <p>Click here to start tracking your water intake: </p>
            <a href="tracking.html" id="goToTracker">Water Intake Tracker</a>
         </div>


    
     <script src="goal.js"></script>
     <script src="tracking.js"></script>

    </main>

</body>
</html>
